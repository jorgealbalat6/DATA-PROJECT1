services:

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile.pyIngestion
    image: ingestion:latest
    profiles: [ "workers" ]

  ingestion_datos_historicos:
    build:
      context: ./ingestion_datos_historicos
      dockerfile: Dockerfile.pyIngestionH
    image: ingestion_datos_historicos:latest
    env_file: .env
    networks:
      - kafka-net
    restart: "no"

  alertas_pob_general:
    build:
      context: ./productores/pob_general/alertas
      dockerfile: Dockerfile.pyAlertasG
    image: alertas_pob_general:latest
    env_file: .env
    depends_on:
      - kafka
    networks:
      - kafka-net
    tty: true
    restart: "no"
  alertas_pob_riesgo:
    build:
      context: ./productores/pob_riesgo/alertas
      dockerfile: Dockerfile.pyAlertasR
    image: alertas_pob_riesgo:latest
    env_file: .env
    depends_on:
      - kafka
    networks:
      - kafka-net
    tty: true
    restart: "no"
  datos_pob_general:
    build:
      context: ./productores/pob_general/datos
      dockerfile: Dockerfile.pyDatosG
    image: datos_pob_general:latest
    env_file: .env
    depends_on:
      - kafka
    networks:
      - kafka-net
    tty: true
    restart: "no"
  datos_pob_riesgo:
    build:
      context: ./productores/pob_riesgo/datos
      dockerfile: Dockerfile.pyDatosR
    image: datos_pob_riesgo:latest
    env_file: .env
    depends_on:
      - kafka
    networks:
      - kafka-net
    tty: true
    restart: "no"

  dashboard_pob_general:
    build:
      context: ./dashboard_alertas/pob_general
      dockerfile: Dockerfile.pyDashG
    image: dashboard_pob_general:latest
    env_file: .env
    ports:
      - "8050:8050"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    restart: "no"
  dashboard_pob_riesgo:
    build:
      context: ./dashboard_alertas/pob_riesgo
      dockerfile: Dockerfile.pyDashR
    image: dashboard_pob_riesgo:latest
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kafka-net
    restart: "no"

  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile.pyDBT
    image: dbt:latest
    profiles: [ "workers" ]

  analisis_historico:
    build:
      context: ./analisis_historico
      dockerfile: Dockerfile.pyAnalisis
    image: analisis_historico:latest
    env_file: .env
    volumes:
      - ./analisis_historico:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kafka-net
    restart: "no"

  db:
    image: postgres:17-alpine
    env_file: .env
    volumes:
      - ./docker-init:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: "no"

  api:
    build:
      context: ./API
      dockerfile: Dockerfile.API
    image: data-project-api
    ports:
      - "5000:5000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kafka-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - kafka-net
    healthcheck:
      test: echo srvr | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - kafka-net

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.3.0
    container_name: control-center
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_ZOOKEEPER_CONNECT: zookeeper:2181
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
    networks:
      - kafka-net

  kafka-init:
    image: confluentinc/cp-kafka:7.3.0
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c " echo 'Creando tópicos...' && kafka-topics --create --topic alertas_pob_generales --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists && kafka-topics --create --topic alertas_pob_riesgo --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists && kafka-topics --create --topic datos_pob_general --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists && kafka-topics --create --topic datos_pob_riesgo --bootstrap-server kafka:29092 --partitions 1 --replication-factor 1 --if-not-exists && echo 'Tópicos creados.' "
    networks:
      - kafka-net

  airflow-postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "airflow" ]
      interval: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    depends_on:
      airflow-postgres:
        condition: service_healthy
    networks:
      - kafka-net
    command: >
      bash -c "airflow db migrate && airflow users create --username airflow --password airflow --firstname Admin --lastname User --role Admin --email admin@example.com"

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: root
    restart: always
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"
    command: webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - kafka-net
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: root
    restart: always
    env_file: .env
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - kafka-net

networks:
  kafka-net:
    driver: bridge
    name: kafka-net

volumes:
  postgres-data:
